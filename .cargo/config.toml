# The guest server (the `distrofs` binary's `serve` mode) is a static
# musl build linked by rust-lld against Rust's self-contained musl — no
# cross C toolchain needed. aarch64 serves ARM VMs; x86_64 serves
# amd64-kernel VMs. See DEV.md "Building the server".
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
