<!DOCTYPE html>

<head>

    <title>container-mount</title>
</head>

<body>
    <p><strong>container-mount</strong> is installed.</p>
    <p>Try it: <code>container-mount servers</code> lists the installed guest
        servers; <code>container mount ls ID:/</code> lists a running
        container's root; <code>container-mount update</code> pulls the
        latest release.</p>
    <p>To remove it later: <code>uninstall-container-mount.sh</code>.</p>
</body>

</html>
