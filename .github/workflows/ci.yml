name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  schedule:
    # Weekly: catches new advisories/drift on unchanged deps between
    # releases. GitHub disables schedules after 60 days of repo
    # inactivity; the release gate (scripts/release-gate.sh) remains the
    # authoritative pre-tag check.
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          # The guest server is a static musl binary — rust-lld links
          # it against Rust's self-contained musl (.cargo/config.toml),
          # no cross C toolchain needed.
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sh -n tests/*.sh scripts/*.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Linux-only server code is cfg'd out of the host build;
      # lint and build it for both musl targets.
      - run: cargo clippy --target aarch64-unknown-linux-musl --all-targets -- -D warnings
      - run: cargo clippy --target x86_64-unknown-linux-musl --all-targets -- -D warnings
      - run: cargo build --release --target aarch64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cargo test --workspace
      # tests/e2e.sh needs an OCI engine (container/podman/docker);
      # it self-skips on runners that have none.
      - run: tests/e2e.sh || true

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --workspace
      # No separate cargo-audit step: deny's advisories check covers the
      # same RustSec DB, and rustsec/audit-check is still on Node 20.
